delta_analytics:
  outputs:
    dev:
      type: spark
      method: thrift
      host: "{{ env_var('SPARK_THRIFT_HOST', 'localhost') }}"
      port: "{{ env_var('SPARK_THRIFT_PORT', 10000) | int }}"
      catalog: main
      schema: analytics
      threads: 4

    # Prod target — swap to Databricks for production
    prod:
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST', '') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH', '/sql/1.0/warehouses/00000000-0000-0000-0000-000000000000') }}"
      catalog: main
      schema: analytics
      threads: 4

  target: dev
