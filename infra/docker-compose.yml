# Delta analytics stack: MinIO + Unity Catalog + Spark (Delta Lake), Databricks-style.
#
#   MinIO          object storage — physically holds every Delta table (s3://delta-warehouse)
#   Unity Catalog  metadata/catalog service — owns names, table locations, vends storage credentials
#   Spark          compute — Thrift Server for dbt/beeline, reads/writes Delta via S3A
#
# Startup order (enforced by depends_on, run with `just infra-up`):
#   minio (healthy) → minio-init (bucket) → unity-catalog (healthy) → uc-init (catalog/schemas) → spark (healthy)

x-minio-env: &minio-env
  MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
  MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-password}

services:
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z  # community fork; upstream minio/minio images are no longer published
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"  # S3 API
      - "9001:9001"  # MinIO console
    environment:
      <<: *minio-env
      # `mc` alias for in-container use: docker exec infra-minio-1 mc ls -r local/delta-warehouse
      MC_HOST_local: http://${MINIO_ROOT_USER:-admin}:${MINIO_ROOT_PASSWORD:-password}@localhost:9000
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z  # reuses the bundled `mc` client
    tmpfs: /data  # the image declares VOLUME /data; avoid leaving an anonymous volume behind
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MC_HOST_local: http://${MINIO_ROOT_USER:-admin}:${MINIO_ROOT_PASSWORD:-password}@minio:9000
    entrypoint: ["mc", "mb", "--ignore-existing", "local/delta-warehouse"]

  unity-catalog:
    image: unitycatalog/unitycatalog:v0.5.0
    depends_on:
      minio-init:
        condition: service_completed_successfully
    ports:
      - "8090:8080"  # UC REST API (host 8081 is taken in Amp orbs)
    environment:
      <<: *minio-env
    volumes:
      - ./uc/conf/server.properties:/opt/uc-conf/server.properties:ro
      - uc-db:/home/unitycatalog/etc/db
    # Append the MinIO credentials UC vends to Spark for s3://delta-warehouse, then start the server.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cp /opt/uc-conf/server.properties etc/conf/server.properties
        printf 's3.accessKey.0=%s\ns3.secretKey.0=%s\n' "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >> etc/conf/server.properties
        exec ./bin/start-uc-server
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/2.1/unity-catalog/catalogs > /dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  uc-init:
    image: unitycatalog/unitycatalog:v0.5.0
    depends_on:
      unity-catalog:
        condition: service_healthy
    # Idempotent: create only what is missing; any create failure fails startup.
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        uc() { bin/uc --server http://unity-catalog:8080 "$$@"; }
        uc catalog get --name prod > /dev/null 2>&1 ||
          uc catalog create --name prod --storage_root s3://delta-warehouse/prod --comment 'Main analytics catalog'
        for schema in default analytics raw; do
          uc schema get --full_name "prod.$$schema" > /dev/null 2>&1 ||
            uc schema create --catalog prod --name "$$schema" --storage_root "s3://delta-warehouse/prod/$$schema"
        done
        echo 'Unity Catalog bootstrapped: prod.default, prod.analytics, prod.raw on s3://delta-warehouse/prod'

  spark:
    build: ./spark  # deltaio/delta-docker:4.3.0 + pinned UC connector and hadoop-aws jars
    image: delta-analytics-spark:4.3.0
    ports:
      - "10000:10000"  # Spark Thrift Server (dbt-spark connects here)
      - "4040:4040"    # Spark UI
    volumes:
      - ./spark/conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
    depends_on:
      uc-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/10000' 2>/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 60s

volumes:
  uc-db:       # Unity Catalog metadata (H2 database)
  minio-data:  # Delta table data + _delta_log for every catalog table
