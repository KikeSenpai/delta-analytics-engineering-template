# Unity Catalog server configuration
# https://docs.unitycatalog.io/server/configuration/

server.env=dev
server.authorization=disable

# Enable managed table support so dbt CREATE TABLE ... USING DELTA creates
# UC-managed tables with server-allocated storage under the schema storage root.
server.managed-table.enabled=true

# Storage credentials for the MinIO bucket that holds all managed tables.
# UC vends these to Spark per table (credential vending), Databricks-style.
# s3.accessKey.0 / s3.secretKey.0 are appended at container start from
# MINIO_ROOT_USER / MINIO_ROOT_PASSWORD (see infra/docker-compose.yml).
#
# UC 0.5.0 cannot call a custom (MinIO) STS endpoint. A non-empty sessionToken
# makes UC vend the static keys as-is instead of calling AWS STS AssumeRole.
# Spark uses SimpleAWSCredentialsProvider, which sends only the vended
# access/secret keys, so this placeholder token never reaches MinIO.
s3.bucketPath.0=s3://delta-warehouse
s3.region.0=us-east-1
s3.awsRoleArn.0=arn:aws:iam::000000000000:role/minio-static-credentials
s3.sessionToken.0=minio-static-credentials
