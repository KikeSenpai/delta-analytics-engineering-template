# Delta Lake session extensions
spark.sql.extensions             io.delta.sql.DeltaSparkSessionExtension
spark.sql.catalog.spark_catalog  org.apache.spark.sql.delta.catalog.DeltaCatalog

# Unity Catalog — prod catalog (Databricks-style 3-level namespace)
spark.sql.catalog.prod          io.unitycatalog.spark.UCSingleCatalog
spark.sql.catalog.prod.uri      http://unity-catalog:8080
spark.sql.catalog.prod.token    ""
# UC vends static MinIO keys (no expiry), so pass them through as plain fs.s3a.* keys
# instead of the renewing AwsVendedTokenProvider.
spark.sql.catalog.prod.renewCredential.enabled  false
spark.sql.defaultCatalog         prod

# MinIO S3A — table data lives in s3://delta-warehouse. Spark holds no storage keys of
# its own: the access/secret keys come from Unity Catalog credential vending per table.
# UC hands out s3:// locations (Databricks-style); serve them with S3A.
spark.hadoop.fs.s3.impl                      org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.AbstractFileSystem.s3.impl   org.apache.hadoop.fs.s3a.S3A
spark.hadoop.fs.s3a.endpoint                 http://minio:9000
spark.hadoop.fs.s3a.endpoint.region          us-east-1
spark.hadoop.fs.s3a.path.style.access        true
spark.hadoop.fs.s3a.connection.ssl.enabled   false
# Sends only the vended access/secret keys; UC's placeholder session token is ignored.
spark.hadoop.fs.s3a.aws.credentials.provider org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider
