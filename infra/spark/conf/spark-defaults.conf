# Delta Lake session extensions
spark.sql.extensions             io.delta.sql.DeltaSparkSessionExtension
spark.sql.catalog.spark_catalog  org.apache.spark.sql.delta.catalog.DeltaCatalog

# Unity Catalog — prod catalog (Databricks-style 3-level namespace)
spark.sql.catalog.prod          io.unitycatalog.spark.UCSingleCatalog
spark.sql.catalog.prod.uri      http://unity-catalog:8080
spark.sql.catalog.prod.token    ""
spark.sql.defaultCatalog         prod

# MinIO S3A — optional, used when MinIO profile is enabled
spark.hadoop.fs.s3a.endpoint     http://minio:9000
spark.hadoop.fs.s3a.path.style.access  true
spark.hadoop.fs.s3a.connection.ssl.enabled  false
spark.hadoop.fs.s3a.impl         org.apache.hadoop.fs.s3a.S3AFileSystem

# Ivy cache to /tmp (avoids permission issues in container)
spark.driver.extraJavaOptions    -Divy.cache.dir=/tmp -Divy.home=/tmp
