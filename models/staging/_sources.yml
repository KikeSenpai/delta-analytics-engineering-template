version: 2

sources:
  - name: raw
    schema: raw
    description: "Raw source tables landed in the Delta warehouse"
    tables:
      - name: orders
        description: "Raw order records"
        columns:
          - name: order_id
            description: "Unique order identifier"
            tests:
              - not_null
              - unique
          - name: customer_id
            tests:
              - not_null
          - name: order_date
            tests:
              - not_null
