version: 2

models:
  - name: stg_pipedrive__users
    description: Typed Pipedrive users, one row per user.
    columns:
      - name: user_id
        data_tests: [not_null, unique]
      - name: email
        data_tests: [not_null]
      - name: modified_at
        data_tests: [not_null]

  - name: stg_pipedrive__stages
    description: Deal-stage lookup at stage_id grain.
    columns:
      - name: stage_id
        data_tests:
          - not_null
          - unique
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5, 6, 7, 8, 9]
      - name: stage_name
        data_tests: [not_null, unique]

  - name: stg_pipedrive__fields
    description: Deal-change field metadata at field_id grain.
    columns:
      - name: field_id
        data_tests: [not_null, unique]
      - name: field_key
        data_tests: [not_null, unique]

  - name: stg_pipedrive__deal_changes
    description: Typed field-change events. deal_id is not unique in the supplied extract.
    columns:
      - name: deal_id
        data_tests: [not_null]
      - name: changed_at
        data_tests: [not_null]
      - name: changed_field_key
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['add_time', 'user_id', 'stage_id', 'lost_reason']
          - relationships:
              arguments:
                to: ref('stg_pipedrive__fields')
                field: field_key
      - name: new_value
        data_tests: [not_null]

  - name: stg_pipedrive__activity_types
    description: Typed activity-type lookup.
    columns:
      - name: activity_type_id
        data_tests: [not_null, unique]
      - name: activity_type
        data_tests: [not_null, unique]
      - name: activity_type_name
        data_tests: [not_null, unique]
      - name: is_active
        data_tests: [not_null]

  - name: stg_pipedrive__activities
    description: Typed activity records; activity_record_key replaces the non-unique supplied activity_id.
    columns:
      - name: activity_record_key
        data_tests: [not_null, unique]
      - name: activity_id
        data_tests: [not_null]
      - name: activity_type
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_pipedrive__activity_types')
                field: activity_type
      - name: assigned_user_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_pipedrive__users')
                field: user_id
      - name: deal_id
        data_tests: [not_null]
      - name: is_done
        data_tests: [not_null]
      - name: due_at
        data_tests: [not_null]
